name: release

# Publishes a GitHub Release with cinezoom.lua attached, tagged v<M.VERSION>.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# The README download button points at releases/latest/download/cinezoom.lua.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run tests
        run: luajit tests/run.lua
      - name: Check the committed bundle is up to date
        run: luajit tools/bundle.lua --check
      - name: Work out the tag
        run: |
          version=$(sed -n 's/^M.VERSION = "\(.*\)"/\1/p' src/cinezoom/main.lua)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match M.VERSION ($version) in src/cinezoom/main.lua"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists: just replace the attached script
            gh release upload "$TAG" cinezoom.lua --clobber
          else
            gh release create "$TAG" cinezoom.lua \
              --target "$GITHUB_SHA" \
              --title "OBSCineZoom $TAG" \
              --generate-notes
          fi
